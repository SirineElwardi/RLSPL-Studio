[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rlspl-studio-core"
version = "0.15.3"
description = "Interface-independent configuration core for RLSPL Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.8,<3"]

[project.scripts]
rlspl = "rlspl_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rlspl_studio = ["product_templates/**/*.tmpl", "web/*.html", "web/*.js", "web/*.css"]
